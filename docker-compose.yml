services:
  postgres:
    image: postgres:17-alpine
    container_name: feedback-investigator-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feedback_investigator}
      POSTGRES_USER: ${POSTGRES_USER:-feedback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedback_local_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - feedback_investigator_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedback-investigator-api
    environment:
      PORT: 8080
      DATABASE_URL: "postgres://${POSTGRES_USER:-feedback}:${POSTGRES_PASSWORD:-feedback_local_password}@postgres:5432/${POSTGRES_DB:-feedback_investigator}?sslmode=disable"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  feedback_investigator_postgres_data: